name: Build and deploy Poor Louis Labs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
      - name: Build Astro site with static fallback
        shell: bash
        env:
          SITE_BASE: /
          SITE_URL: https://www.poorlouislabs.com
        run: |
          set +e
          npm install --no-audit --no-fund
          install_status=$?
          build_status=1
          if [[ $install_status -eq 0 ]]; then
            npm run build
            build_status=$?
          fi
          set -e

          if [[ $install_status -ne 0 || $build_status -ne 0 ]]; then
            echo "::warning::Astro build failed; publishing the committed static fallback."
            rm -rf dist
            mkdir -p dist
            cp index.html dist/index.html
            cp CNAME dist/CNAME
            cp .nojekyll dist/.nojekyll
          fi

          test -s dist/index.html
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
